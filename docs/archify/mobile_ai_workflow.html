<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --line: #2a2f3a;
    --text: #e6e8ee;
    --muted: #8b93a7;
    --main: #5a6377;
    --view: #2f5f8f;
    --fail: #b4545f;
    --manual: #c9a227;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header { padding: 22px 30px 6px; }
  h1 { font-size: 20px; margin: 0 0 6px; font-weight: 650; letter-spacing: .2px; }
  .meta { color: var(--muted); font-size: 13px; }
  .legend { display: flex; flex-wrap: wrap; gap: 18px; padding: 10px 30px 4px; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .swatch.main { background: #1b2029; border: 1.5px solid #3a4252; }
  .swatch.view { background: #15202e; border: 1.5px solid var(--view); }
  .swatch.failure { background: #2a1a1d; border: 1.5px solid var(--fail); }
  .swatch.manual { background: transparent; border: 1.5px dashed var(--manual); }
  .canvas-wrap { padding: 8px 20px 0; }
  svg { display: block; width: 100%; height: auto; }
  .node rect { fill: #1b2029; stroke: #3a4252; stroke-width: 1.5; }
  .node.view rect { fill: #15202e; stroke: var(--view); }
  .node.failure rect { fill: #2a1a1d; stroke: var(--fail); }
  .node text.title { font-size: 14px; font-weight: 600; fill: #e6e8ee; }
  .node text.detail { font-size: 11px; fill: #8b93a7; }
  .edge { fill: none; stroke: var(--main); stroke-width: 1.7; }
  .edge.failure { stroke: var(--fail); stroke-dasharray: 6 5; }
  .edge.manual { stroke: var(--manual); stroke-dasharray: 3 5; }
  .edge-label {
    font-size: 11px;
    fill: #aab2c5;
    paint-order: stroke;
    stroke: var(--bg);
    stroke-width: 4px;
    stroke-linejoin: round;
  }
  footer { padding: 10px 30px 26px; color: var(--muted); font-size: 12px; line-height: 1.7; }
  code { color: #c8d0e0; background: #171a21; border: 1px solid var(--line); padding: 1px 5px; border-radius: 4px; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f7f8fa; --panel: #ffffff; --line: #e3e6ec; --text: #1c2028; --muted: #667085; }
    .node rect { fill: #ffffff; stroke: #cdd3de; }
    .node.view rect { fill: #f0f7ff; stroke: var(--view); }
    .node.failure rect { fill: #fff2f3; stroke: var(--fail); }
    .node text.title { fill: #1c2028; }
    .node text.detail { fill: #667085; }
    .edge-label { fill: #475467; stroke: var(--bg); }
    .swatch.main { background: #ffffff; }
    .swatch.view { background: #f0f7ff; }
    .swatch.failure { background: #fff2f3; }
    code { background: #ffffff; }
  }
</style>

<script>
(function () {
  "use strict";
  var data = JSON.parse(document.getElementById("graph-data").textContent);
  var NS = "http://www.w3.org/2000/svg";
  var W = data.layout.nodeWidth;
  var H = data.layout.nodeHeight;
  var svg = document.getElementById("graph");
  svg.setAttribute("viewBox", "0 0 " + data.layout.width + " " + data.layout.height);
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

  function el(name, attrs, text) {
    var n = document.createElementNS(NS, name);
    if (attrs) Object.keys(attrs).forEach(function (k) { n.setAttribute(k, attrs[k]); });
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }

  // markers
  var defs = el("defs");
  [["arrow", "#5a6377"], ["arrowFail", "#b4545f"], ["arrowManual", "#c9a227"]].forEach(function (m) {
    var marker = el("marker", {
      id: m[0], viewBox: "0 0 10 10", refX: "9", refY: "5",
      markerWidth: "7", markerHeight: "7", orient: "auto-start-reverse"
    });
    marker.appendChild(el("path", { d: "M 0 0 L 10 5 L 0 10 z", fill: m[1] }));
    defs.appendChild(marker);
  });
  svg.appendChild(defs);

  document.getElementById("title").textContent = data.title;
  document.getElementById("meta").textContent =
    data.level + " · v" + data.version + " · " + data.updated +
    " · " + data.nodes.length + " 节点 / " + data.edges.length + " 边";

  var legend = document.getElementById("legend");
  data.legend.forEach(function (item) {
    var span = document.createElement("span");
    var sw = document.createElement("i");
    sw.className = "swatch " + item.type;
    span.appendChild(sw);
    span.appendChild(document.createTextNode(item.label));
    legend.appendChild(span);
  });

  var byId = {};
  data.nodes.forEach(function (n) { byId[n.id] = n; });

  function defaultPoints(a, b) {
    var ax = a.x + W / 2, ay = a.y + H / 2;
    var bx = b.x + W / 2, by = b.y + H / 2;
    if (Math.abs(bx - ax) >= Math.abs(by - ay)) {
      return bx > ax
        ? [[a.x + W, ay], [b.x, by]]
        : [[a.x, ay], [b.x + W, by]];
    }
    return by > ay
      ? [[ax, a.y + H], [bx, b.y]]
      : [[ax, a.y], [bx, b.y + H]];
  }

  function roundedPath(pts, r) {
    if (pts.length < 2) return "";
    var d = "M " + pts[0][0] + " " + pts[0][1];
    for (var i = 1; i < pts.length - 1; i++) {
      var p0 = pts[i - 1], p1 = pts[i], p2 = pts[i + 1];
      var v1x = p1[0] - p0[0], v1y = p1[1] - p0[1];
      var v2x = p2[0] - p1[0], v2y = p2[1] - p1[1];
      var l1 = Math.hypot(v1x, v1y), l2 = Math.hypot(v2x, v2y);
      if (!l1 || !l2) { d += " L " + p1[0] + " " + p1[1]; continue; }
      var rr = Math.min(r, l1 / 2, l2 / 2);
      var q1x = p1[0] - v1x / l1 * rr, q1y = p1[1] - v1y / l1 * rr;
      var q2x = p1[0] + v2x / l2 * rr, q2y = p1[1] + v2y / l2 * rr;
      d += " L " + q1x + " " + q1y + " Q " + p1[0] + " " + p1[1] + " " + q2x + " " + q2y;
    }
    var last = pts[pts.length - 1];
    d += " L " + last[0] + " " + last[1];
    return d;
  }

  // edges first (under nodes)
  var labels = [];
  data.edges.forEach(function (e) {
    var a = byId[e.from], b = byId[e.to];
    if (!a || !b) return;
    var pts = e.points && e.points.length ? e.points : defaultPoints(a, b);
    var path = el("path", { d: roundedPath(pts, 12), "class": "edge " + (e.kind || "") });
    var marker = e.kind === "failure" ? "arrowFail" : (e.kind === "manual" ? "arrowManual" : "arrow");
    path.setAttribute("marker-end", "url(#" + marker + ")");
    svg.appendChild(path);
    labels.push({ edge: e, path: path });
  });

  // nodes
  data.nodes.forEach(function (n) {
    var g = el("g", { "class": "node " + n.type });
    g.appendChild(el("rect", { x: n.x, y: n.y, width: W, height: H, rx: 10 }));
    g.appendChild(el("text", { x: n.x + 14, y: n.y + 27, "class": "title" }, n.label));
    (n.detail || []).forEach(function (line, i) {
      g.appendChild(el("text", { x: n.x + 14, y: n.y + 49 + i * 15, "class": "detail" }, line));
    });
    svg.appendChild(g);
  });

  // labels on top
  labels.forEach(function (item) {
    var e = item.edge, path = item.path;
    var len = 0;
    try { len = path.getTotalLength(); } catch (err) { return; }
    if (!len) return;
    var p = path.getPointAtLength(len / 2);
    svg.appendChild(el("text", {
      x: p.x, y: p.y - 7, "class": "edge-label", "text-anchor": "middle"
    }, e.label));
  });

  document.getElementById("footer").textContent =
    "主节点 5 个，视图 1 个，失败出口 1 个，人工入口 2 条；每习惯每天一次，复用已同步的 habitReminders 字段。待确认假设见 docs/product/mobile-habit-reminders_brief.md（单次/关闭 tombstone/点击打开习惯页/无通知中心/权限不反复弹）。图与 mobile_habit_reminders_workflow.json 同源。";
})();
</script>
