name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # 移动端是独立 package（dexie / @capacitor 不在根依赖里），typecheck 会一起检查。
      - run: npm ci --prefix mobile
      - run: npm run typecheck
      - run: npm test
